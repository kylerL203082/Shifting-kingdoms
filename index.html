
<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#241a13">
<title>Shifting Kingdoms — The Four Kingdoms</title>
<style>
:root{--dark:#201812;--dark2:#33251a;--wood:#4e3522;--edge:#9a7143;--parch:#eddbb0;--ink:#3a271b;--gold:#e7bf70;--white:#fff2ce}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#181713;color:var(--white);font:15px Georgia,'Times New Roman',serif}
button,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.42;cursor:default}
button:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid #f8db78;outline-offset:2px}
h1,h2,h3,p{margin:0 0 9px}
h1{font-size:clamp(2.5rem,6vw,5.3rem);font-weight:normal;line-height:1.07}
h2{font-size:1.3rem}
h3{font-size:1.08rem}
.small{font-size:.82rem}

.btn:hover:not(:disabled){filter:brightness(1.15)}
.btn.primary{background:linear-gradient(#d9ae66,#956830);color:#2b1c11;font-weight:bold}
.btn.red{background:linear-gradient(#a24d37,#642921)}
.btn.subtle{background:#271f17}

.btn.wide{width:100%}
.panel{background:linear-gradient(130deg,#f6e7bf,#d5b987);color:var(--ink);border:5px ridge #8a613c;box-shadow:inset 0 0 20px #ac834c70,0 7px 20px #0008;padding:11px;position:relative}
.panel h2{border-bottom:2px solid #906842;padding-bottom:5px}

.row{display:flex;gap:8px;align-items:center;justify-content:space-between}

.rule{height:1px;background:#97724e;margin:10px 0}
.wood{background:repeating-linear-gradient(0deg,#352419,#352419 23px,#3f2b1d 24px,#332217 26px);border:3px ridge #9f7349}
.top{height:68px;display:flex;align-items:center;justify-content:space-between;padding:6px 20px;border-bottom:5px ridge #a77d4b;background:linear-gradient(180deg,#543a26,#20150e);gap:12px}
.logo{font-size:clamp(1.35rem,3vw,2.4rem);font-variant:small-caps;font-weight:bold;letter-spacing:.035em;color:#f5dc9b;text-shadow:0 2px #130c08,0 0 18px #bf8f43aa}
.tag{color:#c8a576;font-size:.8rem;letter-spacing:.1em}
.main{display:grid;grid-template-columns:218px minmax(0,1fr) 251px;gap:7px;min-height:calc(100vh - 68px);max-width:1800px;margin:auto;padding:8px}

.map-scroll{overflow:auto;max-height:calc(100vh - 122px);background:#718a60}
.map-scroll svg{display:block;width:100%;min-width:725px;min-height:530px;aspect-ratio:1200/790;user-select:none}
.mapfoot{font-size:.78rem;color:#d9bf8a;text-align:center;padding:8px;background:#1e1c16}
.phase{display:flex;align-items:center;gap:8px;padding:9px;border:1px solid #a78257;margin:5px 0;color:#6c553c;background:#d1bc96}
.phase.active{background:linear-gradient(110deg,#f7d993,#ebc176);color:#5a3317;font-weight:bold;box-shadow:0 0 0 2px #ad7e3a inset}
.phase.done{background:#dbd2af;color:#69804a}
.num{border:2px solid currentColor;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:bold}
.resource{display:flex;justify-content:space-between;border-bottom:1px solid #a8906c;padding:5px 1px}
.resource:last-child{border:0}

.crest{width:40px;height:51px;clip-path:polygon(4% 0,96% 0,93% 75%,50% 100%,7% 75%);display:grid;place-items:center;color:#fff2cc;font-size:1.6rem;border:2px solid #f6d69b;flex-shrink:0}
.line{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px 0;border-bottom:1px solid #aa916b}
.line strong{white-space:nowrap}
.notice{border-left:4px solid #94723e;background:#f3e4c0;padding:9px;margin:9px 0;font-size:.87rem;line-height:1.4}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.actions .full{grid-column:1/-1}
.log{max-height:270px;overflow:auto}
.log div{border-bottom:1px solid #b29b77;padding:5px 0;font-size:.8rem;line-height:1.4}
.location{background:#f6ecd2;border:1px solid #aa8c63;padding:9px;margin:8px 0}
.label{font-variant:small-caps;letter-spacing:.07em;color:#865e32;font-weight:bold}
.seats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seat{padding:12px;border:1px solid #a88555;background:#35261a;color:#ffe4b2}
.seat select{width:100%;padding:8px;margin:6px 0 9px;background:#f4e1b8;color:#3c2b1e;border:1px solid #b4945b}
.hero{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 20%,#96704435,transparent 50%),repeating-linear-gradient(90deg,#241910,#241910 45px,#2e2014 47px,#25190e 52px)}
.hero-inner{width:min(850px,100%);border:8px ridge #b78a4a;text-align:center;padding:clamp(25px,5vw,55px);background:linear-gradient(#271e17c9,#141510e0),radial-gradient(circle,#8c714a,transparent);box-shadow:0 30px 80px #000}
.hero-inner p{line-height:1.6}
.hero-crest{font-size:6rem;filter:drop-shadow(0 6px 4px #000);color:#e6bb6c}
.hero .btn{padding:13px 18px}
.setupbox{max-width:850px;margin:25px auto}
.screen-pad{padding:12px}
.svg-node{cursor:pointer}
.svg-node:hover .node-ring{stroke:#fff2bc;stroke-width:5}
.svg-node.selected .node-ring{stroke:#ffeb98;stroke-width:6;filter:drop-shadow(0 0 6px #f7db78)}
.svg-node.available .node-ring{stroke:#b7f29c;stroke-width:5;stroke-dasharray:3 5}
.routehit{stroke:transparent;stroke-width:21;fill:none;cursor:pointer;pointer-events:stroke}
.routehit:hover{stroke:#ffeab855;stroke-width:17}
.node-label{font-size:13px;font-weight:bold;fill:#49321d;stroke:none;pointer-events:none}
.map-legend{position:absolute;right:10px;bottom:10px;background:#2a211ad9;color:#f6e5be;padding:7px;border:1px solid #a88851;font-size:.75rem;pointer-events:none}
.choice{font-size:.81rem;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #b79a75;padding:6px 1px;gap:6px}
.choice .btn{padding:5px 9px;min-height:30px}
.choice label{flex:1}
.modalback{position:fixed;inset:0;background:#080907e6;z-index:20;display:grid;place-items:center;padding:15px}
.modal{max-width:550px;width:100%;max-height:95vh;overflow-y:auto;border:7px ridge #9c7042;background:linear-gradient(#f5e5bd,#cfb17d);color:#332315;padding:20px;box-shadow:0 20px 65px #000}
.modal h2{font-size:1.6rem}
.modal p{line-height:1.5}
.modal .btnrow{margin-top:14px}
.pill{padding:3px 6px;background:#72573a;color:#fff2c9;border-radius:12px;font:12px Arial,sans-serif}
.token{display:inline-block;vertical-align:middle;width:10px;height:10px;border-radius:50%;margin-right:4px;border:1px solid #382718}
.hint{border:1px solid #b79362;background:#f6e8cb;padding:8px;font-size:.85rem;line-height:1.4;margin:8px 0}
.score{font-size:1.1rem;color:#9a5a23}
.toast{position:fixed;bottom:13px;left:50%;transform:translateX(-50%);z-index:40;padding:12px 18px;color:#ffebb9;background:#30251b;border:2px solid #cda667;box-shadow:0 5px 25px #000;text-align:center;max-width:90vw}
.roster{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #a98b60}
.roster b:last-child{margin-left:auto}
.toolbar{display:flex;flex-wrap:wrap;gap:6px}
.check{display:flex;align-items:center;gap:6px}
.banner{font-size:.81rem;color:#e5cda2;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner b{color:#fff0c5}
svg text{font-family:Georgia,'Times New Roman',serif}
.fade-in{animation:fadeIn .35s ease-out}
@keyframes fadeIn{from{opacity:.3}to{opacity:1}}
@media(max-width:1190px){
 .main{grid-template-columns:200px minmax(0,1fr)}
 .right{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
 .right .panel+.panel{margin:0}
}
@media(max-width:690px){
 .top{height:auto;min-height:64px}
 .main{display:flex;flex-direction:column}
 .left,.right{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
 .left .panel+.panel,.right .panel+.panel{margin:0}
 .mapcol{order:-1}
 .map-scroll{max-height:none}
 .seats{grid-template-columns:1fr}
 .logo{font-size:1.5rem}
 .map-shell{order:0}
}
@media(max-width:430px){
 .left,.right{display:flex;flex-direction:column}
 .top{padding:6px 8px}
 .main{padding:5px}
 .map-legend{display:none}
}
</style>

<body>
<div id="app"></div>
<div id="modal-root" class="hidden"></div>
<div id="toast" class="toast hidden" role="status"></div>
<script>
'use strict';

/* Shifting Kingdoms — the Living Kingdom. Self-contained, no dependencies. */

const VER=2, SAVE='sk-living-v2', PHASES=['collect','build','attack'];

const FACTIONS=[
 {name:'Crimson Lions',color:'#ba4638',mark:'♌',home:'red'},
 {name:'Azure Stags',color:'#3673bb',mark:'♞',home:'blue'},
 {name:'Golden Griffins',color:'#cc9e35',mark:'♛',home:'gold'},
 {name:'Verdant Wolves',color:'#3d986d',mark:'♜',home:'green'}
];

const INFO={
 forest:{resource:'timber',yield:4,icon:'🌲'},
 quarry:{resource:'stone',yield:3,icon:'⛏'},
 farm:{resource:'food',yield:4,icon:'🌾'},
 mine:{resource:'iron',yield:2,icon:'⚒'},
 village:{icon:'⌂'},
 home:{icon:'⌂'},
 castle:{icon:'♜'},
 cross:{icon:'✛'},
 city:{icon:'♛'}
};

const PRICES={timber:2,stone:2,food:2,iron:4};

const BUILD_COST={
 road:{timber:1,stone:1},
 tower:{timber:2,stone:2},
 barracks:{timber:2,stone:2,food:1},
 caravan:{timber:2,stone:1,gold:2},
 town:{timber:3,stone:3,gold:3}
};

const UNITS={
 levy:{
  name:'Levy',icon:'♟',a:1,d:1,
  cost:{food:1,gold:1}
 },
 archer:{
  name:'Archer',icon:'➶',a:2,d:1,
  cost:{timber:1,food:1,gold:1}
 },
 knight:{
  name:'Knight',icon:'♞',a:3,d:2,
  cost:{iron:1,food:2,gold:2}
 }
};

const RK=['gold','timber','stone','food','iron'],UI=Object.keys(UNITS);

const NODES=[
 ['red','Crimson Castle',105,112,'castle'],
 ['blue','Azure Castle',1095,112,'castle'],
 ['gold','Golden Castle',105,676,'castle'],
 ['green','Verdant Castle',1095,676,'castle'],

 ['hr','Crimson Village',234,142,'home'],
 ['hb','Azure Village',963,143,'home'],
 ['hg','Golden Village',229,646,'home'],
 ['hv','Verdant Village',965,648,'home'],

 ['fn','North Farm',398,124,'farm'],
 ['fw','Field of Plenty',143,500,'farm'],
 ['fe','Meadow Farm',861,510,'farm'],
 ['fs','South Farm',834,653,'farm'],

 ['ww','Western Forest',155,322,'forest'],
 ['wn','Pine Forest',776,123,'forest'],
 ['we','Eastern Forest',1078,510,'forest'],
 ['ws','Southern Woods',415,721,'forest'],

 ['qn','Stone Quarry',578,107,'quarry'],
 ['qw','Western Quarry',362,468,'quarry'],
 ['qe','River Quarry',1082,349,'quarry'],

 ['in','Iron Mine',816,321,'mine'],
 ['is','Deep Iron Mine',655,674,'mine'],

 ['vh','Hill Village',377,310,'village'],
 ['ve','East Village',984,301,'village'],
 ['vs','South Village',389,618,'village'],
 ['vn','North Hamlet',677,242,'village'],

 ['jn','Northern Crossroads',572,254,'cross'],
 ['jw','Western Crossroads',481,421,'cross'],
 ['js','Southern Crossroads',589,552,'cross'],
 ['city','Royal City',612,390,'city']
].map(([id,name,x,y,type])=>({id,name,x,y,type}));

const NODE=Object.fromEntries(NODES.map(n=>[n.id,n]));

const EDGES=[
 ['red','hr'],['blue','hb'],['gold','hg'],['green','hv'],
 ['hr','fn'],['hr','ww'],['hr','vh'],
 ['fn','qn'],['fn','vh'],
 ['qn','jn'],['qn','wn'],
 ['wn','hb'],['wn','vn'],
 ['hb','vn'],['hb','ve'],

 ['ww','vh'],['ww','fw'],
 ['vh','jn'],['vh','jw'],['vh','qw'],
 ['vn','jn'],['vn','in'],['jn','city'],['jn','in'],

 ['fw','qw'],['fw','hg'],['qw','jw'],['qw','vs'],
 ['jw','city'],['jw','js'],
 ['hg','vs'],['hg','ws'],['vs','ws'],['vs','js'],

 ['ve','in'],['ve','qe'],['ve','we'],
 ['qe','in'],['qe','city'],['qe','we'],
 ['we','hv'],['we','fe'],['fe','hv'],
 ['fe','fs'],['fe','city'],

 ['city','in'],['city','js'],
 ['js','is'],['js','fs'],['js','vs'],
 ['is','fs'],['is','ws'],['fs','hv']
].map(([a,b])=>({a,b,id:[a,b].sort().join('|')}));

const EDGE=Object.fromEntries(EDGES.map(e=>[e.id,e]));

const incident=id=>EDGES.filter(e=>e.a===id||e.b===id);
const other=(e,id)=>e.a===id?e.b:e.a;
const ec=(a,b)=>[a,b].sort().join('|');
const fmt=n=>n[0].toUpperCase()+n.slice(1);
const byId=id=>NODE[id];

const clone=o=>JSON.parse(JSON.stringify(o));

const escapeHTML=v=>String(v).replace(
 /[&<>"']/g,
 c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])
);

let S=null,screen='menu',selection=null,roadMode=false;
let moveSource=null,moveUnits={levy:0,archer:0,knight:0};
let modal='',busy=false,aiTimer=null,soundOn=true;

let setup={
 count:2,
 controllers:['human','ai','human','ai'],
 factions:[0,1,2,3]
};

const app=document.getElementById('app');
const modalRoot=document.getElementById('modal-root');
const toastEl=document.getElementById('toast');

function tell(s){
 toastEl.textContent=s;
 toastEl.classList.remove('hidden');
 clearTimeout(tell.timer);
 tell.timer=setTimeout(()=>toastEl.classList.add('hidden'),2700);
}

function snd(f=420){
 if(!soundOn)return;
 try{
  const C=window.AudioContext||window.webkitAudioContext;
  snd.ctx=snd.ctx||new C();
  const o=snd.ctx.createOscillator(),g=snd.ctx.createGain();
  o.type='triangle';
  o.frequency.value=f;
  g.gain.setValueAtTime(.035,snd.ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,snd.ctx.currentTime+.14);
  o.connect(g).connect(snd.ctx.destination);
  o.start();o.stop(snd.ctx.currentTime+.15);
 }catch(e){}
}

function log(s){
 S.log.unshift('Round '+S.round+': '+s);
 S.log=S.log.slice(0,65);
}

function persist(){
 try{
  if(S)localStorage.setItem(SAVE,JSON.stringify(S));
 }catch(e){
  tell('Browser storage unavailable. Save could not be written.');
 }
}

function exists(){
 try{return !!localStorage.getItem(SAVE)}
 catch(e){return false}
}

const active=()=>S.players[S.active];
const state=id=>S.places[id];
const troops=u=>UI.reduce((n,k)=>n+(u?.[k]||0),0);

const armies=p=>NODES.reduce(
 (n,v)=>n+(state(v.id).owner===p?troops(state(v.id).units):0),0
);

const power=(u,prop)=>UI.reduce(
 (n,k)=>n+(u[k]||0)*UNITS[k][prop],0
);

const freeUnits=()=>({levy:0,archer:0,knight:0});

const costOK=(p,c)=>Object.entries(c).every(
 ([k,v])=>(p[k]||0)>=v
);

const charge=(p,c)=>{
 for(const k in c)p[k]-=c[k];
};

function armiesSave(s,i){
 return NODES.reduce(
  (a,n)=>a+(s.places[n.id].owner===i?
   troops(s.places[n.id].units):0),0
 );
}

function validSave(s){
 try{
  if(!s||s.version!==VER||
     !Array.isArray(s.players)||
     s.players.length<2||s.players.length>4||
     !s.places||!s.roads||
     !Number.isInteger(s.active)||
     s.active<0||s.active>=s.players.length||
     !PHASES.includes(s.phase)||
     s.round<1||s.round>10||
     !Array.isArray(s.log)||
     !Array.isArray(s.winners))return false;

  for(const n of NODES){
   const x=s.places[n.id];
   if(!x||![null,0,1,2,3].includes(x.owner)||
      !Number.isInteger(x.stock)||
      x.stock<0||x.stock>12||
      ![null,'tower','barracks'].includes(x.building)||
      !x.units||
      UI.some(k=>!Number.isInteger(x.units[k])||
       x.units[k]<0||x.units[k]>4)||
      troops(x.units)>4)return false;
  }

  for(const e of EDGES){
   if(![undefined,0,1,2,3].includes(s.roads[e.id]))
    return false;
  }

  for(let i=0;i<s.players.length;i++){
   let p=s.players[i];

   if(p.id!==i||p.faction<0||p.faction>3||
      !['human','ai'].includes(p.controller)||
      !['red','blue','gold','green'].includes(p.home)||
      RK.some(k=>!Number.isInteger(p[k])||
       p[k]<0||p[k]>100)||
      p.score<0||
      !Array.isArray(p.caravans)||
      p.caravans.length>3||
      armiesSave(s,i)>14)return false;

   for(const c of p.caravans){
    if(!NODE[c.at]||
       c.target&&!NODE[c.target]||
       !['out','back'].includes(c.dir)||
       !['timber','stone','food','iron',null]
        .includes(c.cargoType)||
       c.cargo<0||c.cargo>4)return false;
   }
  }
  return true;
 }catch(e){return false}
}

function newGame(){
 const used=setup.count===2
  ?['red','green']
  :setup.count===3
   ?['red','blue','gold']
   :['red','blue','gold','green'];

 S={
  version:VER,round:1,active:0,
  phase:'collect',collected:false,marketBought:0,
  buildLeft:2,attackLeft:2,players:[],
  places:{},roads:{},log:[],
  finished:false,winners:[]
 };

 for(const n of NODES){
  S.places[n.id]={
   owner:null,stock:0,building:null,
   units:freeUnits(),town:false
  };
 }

 for(let i=0;i<setup.count;i++){
  const home=used[i];

  const homeVillage={
   red:'hr',blue:'hb',gold:'hg',green:'hv'
  }[home];

  const p={
   id:i,home,
   controller:setup.controllers[i],
   faction:setup.factions[i],
   gold:6,timber:2,stone:2,food:2,iron:0,
   score:0,
   caravans:[{
    id:1,at:home,target:null,
    dir:'out',cargo:0,cargoType:null
   }]
  };

  S.players.push(p);
  state(home).owner=i;
  state(homeVillage).owner=i;
  state(home).units={levy:2,archer:1,knight:0};
  S.roads[ec(home,homeVillage)]=i;
 }

 log('The four realms awaken. Establish your roads and send forth caravans.');
 selection=null;roadMode=false;moveSource=null;
 screen='game';
 persist();render();runIfAI();
}

function resume(){
 try{
  const data=JSON.parse(localStorage.getItem(SAVE));
  if(!validSave(data))throw Error('Invalid saved match');

  S=data;
  selection=null;roadMode=false;moveSource=null;
  screen='game';

  // A battle which was not confirmed before closing is canceled.
  if(S.pending){
   S.pending=null;
   persist();
  }

  render();
  runIfAI();
 }catch(e){
  tell('Saved match is invalid or uses a different version.');
 }
}

function connected(p){
 const found=new Set([p.home]),queue=[p.home];

 while(queue.length){
  const u=queue.shift();

  for(const e of incident(u)){
   const v=other(e,u);

   if(S.roads[e.id]!==p.id||
      found.has(v)||
      state(v).owner!==p.id)continue;

   found.add(v);
   queue.push(v);
  }
 }
 return found;
}

function route(p,start,dest){
 if(!NODE[start]||!NODE[dest])return null;

 const done=new Set([start]),q=[[start]];

 while(q.length){
  const path=q.shift(),u=path.at(-1);

  if(u===dest)return path;

  for(const e of incident(u)){
   const v=other(e,u);

   if(S.roads[e.id]!==p.id||
      state(v).owner!==p.id||
      done.has(v))continue;

   done.add(v);
   q.push([...path,v]);
  }
 }
 return null;
}

function roadOptions(p){
 const network=connected(p),list=[];

 for(const e of EDGES){
  if(S.roads[e.id]===p.id)continue;

  const a=state(e.a),b=state(e.b);

  if((network.has(e.a)&&
      b.owner!==null&&b.owner!==p.id)||
     (network.has(e.b)&&
      a.owner!==null&&a.owner!==p.id))continue;

  if(network.has(e.a)||network.has(e.b))
   list.push(e);
 }
 return list;
}

function canBuildRoad(p,e){
 return !!e&&
  S.phase==='build'&&
  S.buildLeft>0&&
  !S.finished&&
  S.roads[e.id]!==p.id&&
  roadOptions(p).some(x=>x.id===e.id)&&
  costOK(p,BUILD_COST.road);
}

function buildRoad(eid){
 const p=active(),e=EDGE[eid];

 if(!canBuildRoad(p,e)){
  return tell('Connect from your existing network and bring 1 Timber + 1 Stone.');
 }

 charge(p,BUILD_COST.road);
 S.roads[e.id]=p.id;

 for(const id of [e.a,e.b]){
  if(state(id).owner===null&&
     byId(id).type!=='city'){
   state(id).owner=p.id;
  }
 }

 S.buildLeft--;

 log(
  FACTIONS[p.faction].name+
  ' builds a road to '+byId(e.a).name+
  ' / '+byId(e.b).name+'.'
 );

 roadMode=false;selection=e.b;
 snd(540);persist();render();
}

function purchase(kind){
 const p=active();

 if(S.finished||S.phase!=='collect'||
    !S.collected||p.controller!=='human')return;

 if(S.marketBought>=4)
  return tell('The visiting merchants are sold out this turn.');

 if(p.gold<PRICES[kind])
  return tell('Not enough Gold.');

 p.gold-=PRICES[kind];
 p[kind]++;
 S.marketBought++;

 log(FACTIONS[p.faction].name+' buys '+fmt(kind)+' at market.');
 snd(560);persist();render();
}

function claimIncome(p){
 const homeVillage={
  red:'hr',blue:'hb',gold:'hg',green:'hv'
 }[p.home];

 return 4+
  (state(homeVillage).town?2:0)+
  NODES.filter(n=>
   n.type==='village'&&
   state(n.id).owner===p.id
  ).length;
}

function tickCaravan(p,c){
 if(!NODE[c.at])c.at=p.home;
 if(!c.target)return;

 let steps=2;

 while(steps-->0){
  if(!NODE[c.target]||
     state(c.target).owner!==p.id||
     !route(p,p.home,c.target)){
   c.target=null;
   return;
  }

  let dest=c.dir==='out'?c.target:p.home;
  const path=route(p,c.at,dest);

  if(!path){
   c.target=null;
   return;
  }

  if(path.length>1)c.at=path[1];

  if(c.at===c.target&&c.dir==='out'){
   const site=byId(c.target),x=state(site.id);
   const res=INFO[site.type]?.resource;

   if(!res||x.stock<=0)break;

   c.cargoType=res;
   c.cargo=Math.min(4,x.stock);
   x.stock-=c.cargo;
   c.dir='back';

   log(
    FACTIONS[p.faction].name+
    ' loads '+c.cargo+' '+fmt(res)+
    ' at '+site.name+'.'
   );
  }

  if(c.dir==='back'&&c.at===p.home){
   if(c.cargoType){
    p[c.cargoType]=Math.min(
     100,p[c.cargoType]+c.cargo
    );

    log(
     FACTIONS[p.faction].name+
     ' receives '+c.cargo+' '+fmt(c.cargoType)+
     ' from a caravan.'
    );
   }

   c.cargo=0;
   c.cargoType=null;
   c.dir='out';
   break;
  }
 }
}

function collect(){
 if(S.finished||
    S.phase!=='collect'||
    S.collected)return false;

 const p=active();

 p.gold=Math.min(100,p.gold+claimIncome(p));

 for(const n of NODES){
  if(!INFO[n.type]?.resource)continue;

  const t=state(n.id);

  if(t.owner===p.id&&connected(p).has(n.id)){
   t.stock=Math.min(12,t.stock+INFO[n.type].yield);
  }
 }

 for(const c of p.caravans)tickCaravan(p,c);

 S.collected=true;

 log(
  FACTIONS[p.faction].name+
  ' collects '+claimIncome(p)+
  ' Gold in taxes and advances caravans.'
 );

 snd(660);persist();render();
 return true;
}

function dispatch(target,caravanIndex){
 const p=active(),n=NODE[target];

 if(!n||
    !INFO[n.type]?.resource||
    state(target).owner!==p.id||
    !route(p,p.home,target)){
  return tell('Connect and control the resource site first.');
 }

 const c=p.caravans[caravanIndex];
 if(!c)return;

 c.target=target;
 if(c.cargo===0)c.dir='out';

 log(
  FACTIONS[p.faction].name+
  ' orders a caravan toward '+n.name+'.'
 );

 persist();render();
}

function buildStructure(kind,id){
 const p=active(),t=state(id);

 if(S.phase!=='build'||
    S.buildLeft<1||
    p.controller==='ai'&&screen!=='game'||
    t.owner!==p.id||
    !connected(p).has(id))return false;

 if(kind==='town'){
  const homeVillage={
   red:'hr',blue:'hb',gold:'hg',green:'hv'
  }[p.home];

  if(id!==homeVillage||
     t.town||
     !costOK(p,BUILD_COST.town))return false;

  t.town=true;
 }else if(kind==='caravan'){
  if(p.caravans.length>=3||
     !costOK(p,BUILD_COST.caravan))return false;

  p.caravans.push({
   id:Date.now()+Math.floor(Math.random()*1000),
   at:p.home,target:null,dir:'out',
   cargo:0,cargoType:null
  });
 }else{
  if(!['tower','barracks'].includes(kind)||
     t.building||
     !costOK(p,BUILD_COST[kind])||
     id===p.home||
     NODE[id].type==='city')return false;

  t.building=kind;
 }

 charge(p,BUILD_COST[kind]);
 S.buildLeft--;

 log(
  FACTIONS[p.faction].name+
  ' constructs '+kind+' at '+NODE[id].name+'.'
 );

 snd(510);persist();render();
 return true;
}

function recruit(kind,id){
 const p=active(),t=state(id),u=UNITS[kind];

 if(!u||
    S.phase!=='build'||
    S.buildLeft<1||
    t.owner!==p.id||
    !(id===p.home||t.building==='barracks')||
    troops(t.units)>=4||
    armies(p.id)>=14||
    !costOK(p,u.cost))return false;

 charge(p,u.cost);
 t.units[kind]++;
 S.buildLeft--;

 log(
  FACTIONS[p.faction].name+
  ' recruits '+u.name+' at '+NODE[id].name+'.'
 );

 snd(590);persist();render();
 return true;
}

function canAttack(from,to,units){
 if(S.phase!=='attack'||
    S.attackLeft<1||
    !EDGE[ec(from,to)]||
    from===to)return false;

 const f=state(from),t=state(to);

 if(f.owner!==S.active||
    troops(units)===0||
    UI.some(k=>
     units[k]<0||units[k]>f.units[k]
    ))return false;

 if(t.owner===S.active&&
    troops(t.units)+troops(units)>4)return false;

 if(t.owner!==null&&
    NODE[to].type==='castle'&&
    t.owner!==S.active)return false;

 return true;
}

function defense(t,id){
 const bonus=
  (t.building==='tower'?2:0)+
  (byId(id).type==='city'?1:0);

 return power(t.units,'d')+bonus;
}

function combat(from,to,units){
 const t=state(to);

 const enemy=
  t.owner!==null&&
  t.owner!==S.active&&
  troops(t.units)>0;

 const atk=
  power(units,'a')+
  (S.roads[ec(from,to)]===S.active?1:0);

 const def=defense(t,to);

 return{enemy,atk,def,win:atk>def};
}

function takeCasualty(u){
 const k=UI.find(k=>u[k]>0);
 if(k)u[k]--;
}

function raidCaravans(id,newOwner){
 for(const op of S.players){
  if(op.id===newOwner)continue;

  for(const c of op.caravans){
   if(c.at===id){
    if(c.cargoType&&c.cargo>0){
     S.players[newOwner][c.cargoType]+=c.cargo;
    }

    c.at=op.home;
    c.target=null;
    c.dir='out';
    c.cargo=0;
    c.cargoType=null;

    log('A caravan is intercepted at '+NODE[id].name+'!');
   }
  }
 }
}

function moveAttack(from,to,units,approved=false){
 if(!canAttack(from,to,units))return false;

 const p=active(),src=state(from),dst=state(to);
 const b=combat(from,to,units);

 if(b.enemy&&!approved){
  openModal(`
   <h2>⚔ Battle for ${escapeHTML(NODE[to].name)}</h2>
   <p>
    Attack strength: <b>${b.atk}</b><br>
    Defense strength: <b>${b.def}</b>
   </p>
   <p>
    ${b.win
     ?'Your army is predicted to win.'
     :'Your attack is predicted to fail.'}
    Battles have no dice.
    A victorious army can suffer one Levy-first casualty
    if both forces began with at least two units.
   </p>
   <div class="btnrow">
    <button class="btn primary" data-action="confirmBattle">
     Confirm Attack
    </button>
    <button class="btn" data-action="cancelBattle">Cancel</button>
   </div>
  `,'battle');

  S.pending={from,to,units};
  persist();
  return true;
 }

 for(const k of UI)src.units[k]-=units[k];

 if(b.enemy){
  const defenders=troops(dst.units);
  const attackers=troops(units);

  if(b.win){
   dst.units=clone(units);

   if(defenders>=2&&attackers>=2){
    takeCasualty(dst.units);
   }

   dst.owner=p.id;
   raidCaravans(to,p.id);

   log(
    FACTIONS[p.faction].name+
    ' conquers '+NODE[to].name+
    ' ('+b.atk+'–'+b.def+').'
   );
  }else{
   if(defenders>=2&&attackers>=2){
    takeCasualty(dst.units);
   }

   log(
    FACTIONS[p.faction].name+
    ' fails to conquer '+NODE[to].name+
    ' ('+b.atk+'–'+b.def+').'
   );
  }
 }else{
  for(const k of UI)dst.units[k]+=units[k];

  if(dst.owner!==p.id){
   dst.owner=p.id;
   raidCaravans(to,p.id);
  }

  log(
   FACTIONS[p.faction].name+
   ' marches to '+NODE[to].name+'.'
  );
 }

 S.attackLeft--;
 selection=to;
 moveSource=null;
 moveUnits=freeUnits();
 S.pending=null;
 closeModal();

 snd(b.enemy?210:460);
 persist();render();
 return true;
}

function pointsFor(p){
 const villages=NODES.filter(n=>
  n.type==='village'&&
  state(n.id).owner===p.id
 ).length;

 const sites=NODES.filter(n=>
  INFO[n.type]?.resource&&
  state(n.id).owner===p.id
 ).length;

 return villages+
  (state('city').owner===p.id?3:0)+
  Math.floor(sites/3);
}

function concludeRound(){
 for(const p of S.players){
  const score=pointsFor(p);
  p.score+=score;

  if(score){
   log(
    FACTIONS[p.faction].name+
    ' earns '+score+' Crown Influence.'
   );
  }
 }

 const max=Math.max(...S.players.map(p=>p.score));

 if(max>=15||S.round>=10){
  let win=S.players.filter(p=>p.score===max);

  if(win.length>1){
   let maxSites=Math.max(...win.map(p=>
    NODES.filter(n=>
     INFO[n.type]?.resource&&
     state(n.id).owner===p.id
    ).length
   ));

   win=win.filter(p=>
    NODES.filter(n=>
     INFO[n.type]?.resource&&
     state(n.id).owner===p.id
    ).length===maxSites
   );
  }

  if(win.length>1){
   const gold=Math.max(...win.map(p=>p.gold));
   win=win.filter(p=>p.gold===gold);
  }

  S.finished=true;
  S.winners=win.map(p=>p.id);
  log('The struggle for the Crown is over.');
 }
}

function advance(){
 if(!S||S.finished||S.pending)return;

 const p=active();

 if(S.phase==='collect'){
  if(!S.collected){
   return tell('Collect your taxes before proceeding.');
  }
  S.phase='build';

 }else if(S.phase==='build'){
  S.phase='attack';
  roadMode=false;
  moveSource=null;

 }else{
  const old=S.active;

  if(old===S.players.length-1){
   concludeRound();
   if(!S.finished)S.round++;
  }

  if(!S.finished){
   S.active=(S.active+1)%S.players.length;
  }

  S.phase='collect';
  S.collected=false;
  S.marketBought=0;
  S.buildLeft=2;
  S.attackLeft=2;
 }

 selection=null;
 roadMode=false;
 moveSource=null;

 persist();
 render();
 runIfAI();
}

function geometry(e){
 const a=NODE[e.a],b=NODE[e.b];
 const dx=b.x-a.x,dy=b.y-a.y;
 const mag=Math.hypot(dx,dy);

 const offset=
  (rand((a.x+b.y+dx)*.03)-.5)*
  Math.min(22,mag*.15);

 const mx=(a.x+b.x)/2-dy/mag*offset;
 const my=(a.y+b.y)/2+dx/mag*offset;

 return `M${a.x} ${a.y} Q${
  (2*mx-(a.x+b.x)/2).toFixed(1)
 } ${
  (2*my-(a.y+b.y)/2).toFixed(1)
 } ${b.x} ${b.y}`;
}

function mapSVG(){
 const p=active();
 const roads=roadOptions(p);
 const options=new Set(roads.map(e=>e.id));

 let o=`
  <svg viewBox="0 0 1200 790"
   xmlns="http://www.w3.org/2000/svg"
   role="img"
   aria-label="Interactive map of four medieval kingdoms and dirt road connections">
   <g>${scene()}</g>
 `;

 for(const e of EDGES){
  const path=geometry(e);
  const owned=S.roads[e.id];
  const colored=owned!==undefined;
  const can=roadMode&&options.has(e.id);

  const stroke=colored
   ?FACTIONS[S.players[owned].faction].color
   :'#ddc28f';

  o+=`
   <g data-edge="${e.id}">
    <path d="${path}" fill="none"
     stroke="#544d37" stroke-opacity=".55"
     stroke-width="15" stroke-linecap="round"/>

    <path d="${path}" fill="none"
     stroke="${stroke}"
     stroke-width="${colored?9:6}"
     stroke-linecap="round"
     ${colored?'':'stroke-dasharray="4 10" opacity=".83"'}/>

    ${colored?`
     <path d="${path}" fill="none"
      stroke="#f1e2bb" stroke-opacity=".65"
      stroke-width="2" stroke-dasharray="7 12"/>`:''}

    ${can?`
     <path d="${path}" fill="none"
      stroke="#f8dc5a" stroke-width="14"
      stroke-dasharray="6 9" opacity=".7"/>`:''}

    <path class="routehit" d="${path}"
     data-edge="${e.id}"/>
   </g>
  `;
 }

 o+='<g>';

 for(const n of NODES){
  o+=`<g transform="translate(${n.x} ${n.y})">
   ${nodeArt(n)}
  </g>`;
 }

 o+='</g></svg>';
 return o;
}

  INFO[n.type]?.resource&&
   state(n.id).owner!==p.id||
  n.type==='village'&&
   state(n.id).owner!==p.id
 ).map(n=>n.id);

 if(!goals.length)return 0;

 const seen=new Set([start]),q=[[start,0]];

 while(q.length){
  const [id,d]=q.shift();

  if(goals.includes(id))return d;

  for(const e of incident(id)){
   const v=other(e,id);

   if(!seen.has(v)){
    seen.add(v);
    q.push([v,d+1]);
   }
  }
 }
 return 9;
}

function bestAIroad(p){
 const opts=roadOptions(p);

 const res=opts.map(e=>{
  const net=connected(p);
  const id=net.has(e.a)?e.b:e.a;
  const n=NODE[id],owner=state(id).owner;

  let value=0;

  if(INFO[n.type]?.resource){
   value+=36+
    (n.type==='forest'?8:0)+
    (n.type==='quarry'?7:0);
  }else if(n.type==='village'){
   value+=18;
  }else if(n.type==='city'){
   value-=12;
  }else{
   value+=17;
  }

  value+=Math.max(0,6-distToGoal(id,p))*3;

  if(owner===p.id)value-=8;
  if(S.roads[e.id]!==undefined)value-=6;

  return{e,value};
 });

 res.sort((a,b)=>b.value-a.value);
 return res[0]?.e;
}

function bestAImarch(p){
 let choices=[];

 for(const n of NODES){
  const t=state(n.id);

  if(t.owner!==p.id||!troops(t.units))continue;

  const sets=[clone(t.units)];

  for(const k of UI){
   if(t.units[k]){
    let u=freeUnits();
    u[k]=t.units[k];
    sets.push(u);
   }
  }

  for(const u of sets){
   for(const e of incident(n.id)){
    const target=other(e,n.id);
    const dst=state(target);

    if(!canAttack(n.id,target,u))continue;

    const b=combat(n.id,target,u);

    if(b.enemy&&!b.win)continue;

    let value=0;

    if(dst.owner!==p.id){
     value+=8;

     if(INFO[NODE[target].type]?.resource)
      value+=18;

     if(NODE[target].type==='city')
      value+=30;

     if(NODE[target].type==='village')
      value+=22;

     if(dst.owner!==null)value+=5;

     value+=Math.max(0,5-distToGoal(target,p))*2;
    }else{
     value+=(
      distToGoal(n.id,p)-distToGoal(target,p)
     )*4-6;
    }

    if(n.id===p.home)value+=5;

    if(state(n.id).building==='tower')
     value-=6;

    if(dst.owner===p.id&&troops(dst.units)>=2)
     value-=12;

    value-=troops(u)*.2;

    choices.push({
     from:n.id,to:target,u,b,value
    });
   }
  }
 }

 choices.sort((a,b)=>b.value-a.value);
 return choices[0];
}

function runIfAI(){
 clearTimeout(aiTimer);

 if(!S||
    screen!=='game'||
    S.finished||
    modal||
    active().controller!=='ai')return;

 aiTimer=setTimeout(aiStep,270);
}

function aiStep(){
 if(!S||
    screen!=='game'||
    S.finished||
    modal||
    active().controller!=='ai'||
    busy)return;

 const p=active();

 if(S.phase==='collect'){
  collect();

  for(const c of p.caravans){
   if(!c.target){
    const n=NODES.find(n=>
     INFO[n.type]?.resource&&
     state(n.id).owner===p.id&&
     route(p,p.home,n.id)
    );

    if(n)c.target=n.id;
   }
  }

  while(S.marketBought<4&&
        p.gold>=2&&
        (p.timber<2||p.stone<2||p.food<1)){

   const k=p.timber<p.stone
    ?'timber'
    :p.stone<2
     ?'stone'
     :'food';

   p.gold-=PRICES[k];
   p[k]++;
   S.marketBought++;
  }

  persist();
  advance();
  return;
 }

 if(S.phase==='build'){
  if(!S.buildLeft){
   advance();
   return;
  }

  let done=false,road=bestAIroad(p);

  if(road&&costOK(p,BUILD_COST.road)){
   buildRoad(road.id);
   done=true;

  }else if(armies(p.id)<9){
   const home=state(p.home);

   let k=p.food>=1&&p.gold>=1
    ?'levy'
    :null;

   if(p.food>=2&&p.iron>=1&&p.gold>=2)
    k='knight';

   if(k&&troops(home.units)<4&&
      costOK(p,UNITS[k].cost)){
    done=recruit(k,p.home);
   }
  }

  if(!done&&costOK(p,BUILD_COST.town)){
   const v={
    red:'hr',blue:'hb',gold:'hg',green:'hv'
   }[p.home];

   if(!state(v).town)
    done=buildStructure('town',v);
  }

  if(!done){
   S.buildLeft=0;
   persist();
   render();
  }

  setTimeout(()=>{
   if(S&&!S.finished&&active().controller==='ai'){
    if(!S.buildLeft)advance();
    else runIfAI();
   }
  },210);

  return;
 }

 if(S.phase==='attack'){
  if(!S.attackLeft){
   advance();
   return;
  }

  const choice=bestAImarch(p);

  if(choice&&choice.value>0){
   moveAttack(choice.from,choice.to,choice.u,true);
  }else{
   S.attackLeft=0;
   persist();
   render();
  }

  setTimeout(()=>{
   if(S&&!S.finished&&active().controller==='ai'){
    if(!S.attackLeft)advance();
    else runIfAI();
   }
  },210);
 }
}

/* All user actions are validated by the game rules. */

function selectNode(id){
 if(!S||S.finished||modal||busy||
    active().controller==='ai')return;

 if(roadMode){
  selection=id;
  render();
  return;
 }

 if(moveSource&&
    S.phase==='attack'&&
    id!==moveSource&&
    troops(moveUnits)>0&&
    canAttack(moveSource,id,moveUnits)){

  moveAttack(moveSource,id,clone(moveUnits));
  return;
 }

 selection=id;
 moveSource=null;
 moveUnits=freeUnits();
 render();
}

function selectEdge(id){
 if(!S||S.finished||modal||busy||
    active().controller==='ai')return;

 if(roadMode&&
    S.phase==='build'&&
    canBuildRoad(active(),EDGE[id])){

  buildRoad(id);
  return;
 }

 selection='edge:'+id;
 moveSource=null;
 render();
}

function changeMove(kind,d){
 if(!moveSource||!UNITS[kind])return;

 const available=state(moveSource).units[kind];

 moveUnits[kind]=Math.max(
  0,
  Math.min(available,moveUnits[kind]+d)
 );

 render();
}

function handle(action,data={}){
 if(busy)return;

 if(modal&&![
  'close','buy','confirmBattle','cancelBattle',
  'setup','leave'
 ].includes(action))return;

 if(action==='rules'){
  rules();
  return;
 }

 if(action==='close'){
  closeModal();

  if(S?.finished)showVictory();
  else render();

  return;
 }

 if(action==='menu'){
  if(screen==='game'&&!S?.finished){
   openModal(`
    <h2>Leave this Match?</h2>

    <p>
     Your game is saved automatically.
     You can continue from the main menu.
    </p>

    <div class="btnrow">
     <button class="btn primary" data-action="leave">
      Save and Exit
     </button>

     <button class="btn" data-action="close">
      Stay
     </button>
    </div>
   `,'leave');

  }else{
   screen='menu';
   closeModal();
   render();
  }
  return;
 }

 if(action==='leave'){
  clearTimeout(aiTimer);
  closeModal();
  screen='menu';
  render();
  return;
 }

 if(action==='setup'){
  clearTimeout(aiTimer);
  closeModal();
  screen='setup';
  render();
  return;
 }

 if(action==='resume'){
  closeModal();
  resume();
  return;
 }

 if(action==='start'){
  if(new Set(
    setup.factions.slice(0,setup.count)
   ).size!==setup.count){
   return tell('Choose a different faction for each player.');
  }

  closeModal();
  newGame();
  return;
 }

 if(action==='sound'){
  soundOn=!soundOn;
  render();
  return;
 }

 if(!S||screen!=='game'||S.finished)return;

 if(action==='confirmBattle'){
  const q=S.pending;
  if(!q)return;

  const from=q.from,to=q.to,u=q.units;

  S.pending=null;
  closeModal();
  moveAttack(from,to,u,true);
  return;
 }

 if(action==='cancelBattle'){
  S.pending=null;
  closeModal();
  persist();
  render();
  return;
 }

 if(action==='buy'){
  purchase(data.kind);
  market();
  return;
 }

 if(active().controller==='ai'||S.pending)return;

 if(action==='collect'){
  collect();
  return;
 }

 if(action==='market'){
  market();
  return;
 }

 if(action==='roadMode'){
  roadMode=!roadMode;
  selection=null;
  moveSource=null;
  render();
  return;
 }

 if(action==='caravans'){
  caravanModal();
  return;
 }

 if(action==='next'){
  advance();
  return;
 }

 if(action==='road'){
  buildRoad(data.id);
  return;
 }

 if(action==='newCaravan'){
  if(!buildStructure('caravan',active().home)){
   tell('A caravan costs 2 Timber, 1 Stone, and 2 Gold.');
  }
  return;
 }

 if(action==='structure'){
  if(!buildStructure(data.kind,data.id)){
   tell('Construction unavailable: check materials, territory, and remaining build actions.');
  }
  return;
 }

 if(action==='recruit'){
  if(!recruit(data.kind,data.id)){
   tell('Recruitment unavailable: check food, Gold, Iron, and garrison capacity.');
  }
  return;
 }

 if(action==='chooseArmy'){
  if(S.phase!=='attack')return;

  moveSource=data.id;
  moveUnits=clone(state(data.id).units);
  selection=data.id;
  roadMode=false;
  render();
  return;
 }

 if(action==='adjust'){
  changeMove(data.kind,+data.d);
  return;
 }

 if(action==='dispatchSelect'){
  let p=active();
  let index=p.caravans.findIndex(c=>!c.target);

  dispatch(data.id,index>=0?index:0);
  return;
 }
}

/* Interface event listeners */

app.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');

 if(b&&!b.disabled){
  handle(b.dataset.action,b.dataset);
  return;
 }

 const n=e.target.closest('[data-node]');

 if(n){
  selectNode(n.dataset.node);
  return;
 }

 const r=e.target.closest('[data-edge]');

 if(r){
  selectEdge(r.dataset.edge);
  return;
 }
});

app.addEventListener('keydown',e=>{
 if(e.key!=='Enter'&&e.key!==' ')return;

 const n=e.target.closest('[data-node]');

 if(n){
  e.preventDefault();
  selectNode(n.dataset.node);
 }
});

app.addEventListener('change',e=>{
 const t=e.target;

 if(t.id==='count'){
  setup.count=+t.value;

  const taken=new Set();

  for(let i=0;i<setup.count;i++){
   if(taken.has(setup.factions[i])){
    setup.factions[i]=[0,1,2,3]
     .find(n=>!taken.has(n));
   }

   taken.add(setup.factions[i]);
  }

  render();
  return;
 }

 if(t.dataset.seat!==undefined){
  const i=+t.dataset.seat;

  if(t.dataset.setting==='controller'){
   setup.controllers[i]=t.value;

  }else{
   const chosen=+t.value;

   if(setup.factions.some(
    (n,j)=>i!==j&&j<setup.count&&n===chosen
   )){
    tell('Each faction can only be chosen once.');
    render();
    return;
   }

   setup.factions[i]=chosen;
  }

  render();
  return;
 }
});

modalRoot.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');

 if(b&&!b.disabled){
  handle(b.dataset.action,b.dataset);
 }
});

modalRoot.addEventListener('change',e=>{
 const w=e.target.closest('[data-wagon]');

 if(!w||!S)return;

 const index=+w.dataset.wagon;
 const c=active().caravans[index];

 if(!c)return;

 if(!w.value){
  c.target=null;

  if(!c.cargo){
   c.dir='out';
  }

  persist();
  return;
 }

 dispatch(w.value,index);
 caravanModal();
});

window.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&modal==='rules'){
  closeModal();
 }
});

/* Launch */
render();

</script>
</body>
</html>
