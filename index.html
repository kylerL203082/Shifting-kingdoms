</style></head><body><div id="app"></div><div id="modal-root" class="hidden"></div><div id="toast" class="toast hidden" role="status"></div><script>
'use strict';
/* Shifting Kingdoms — the Living Kingdom. Self-contained, no dependencies. */
const VER=3, SAVE='sk-living-v3', OLD_SAVE='sk-living-v2';
const FACTIONS=[{name:'Crimson Lions',color:'#ba4638',mark:'♌',home:'red'},{name:'Azure Stags',color:'#3673bb',mark:'♞',home:'blue'},{name:'Golden Griffins',color:'#cc9e35',mark:'♛',home:'gold'},{name:'Verdant Wolves',color:'#3d986d',mark:'♜',home:'green'}];
const INFO={forest:{resource:'timber',yield:4,icon:'🌲'},quarry:{resource:'stone',yield:3,icon:'🪨'},farm:{resource:'food',yield:4,icon:'🌾'},mine:{resource:'iron',yield:2,icon:'⛏️'},village:{icon:'🏘️'},home:{icon:'🏘️'},castle:{icon:'🏰'},cross:{icon:'🛤️'},city:{icon:'🏛️'}};
const PRICES={timber:2,stone:2,food:2,iron:4},BUILD_COST={road:{timber:1,stone:1},tower:{timber:2,stone:2},barracks:{timber:2,stone:2,food:1},caravan:{timber:2,stone:1,gold:2},town:{timber:3,stone:3,gold:3}},UNITS={levy:{name:'Levy',icon:'♟',a:1,d:1,cost:{food:1,gold:1}},archer:{name:'Archer',icon:'➶',a:2,d:1,cost:{timber:1,food:1,gold:1}},knight:{name:'Knight',icon:'♞',a:3,d:2,cost:{iron:1,food:2,gold:2}}},RK=['gold','timber','stone','food','iron'],UI=Object.keys(UNITS);
const NODES=[
 ['red','Crimson Castle',105,112,'castle'],['blue','Azure Castle',1095,112,'castle'],['gold','Golden Castle',105,676,'castle'],['green','Verdant Castle',1095,676,'castle'],
 ['hr','Crimson Village',234,142,'home'],['hb','Azure Village',963,143,'home'],['hg','Golden Village',229,646,'home'],['hv','Verdant Village',965,648,'home'],
 ['fn','North Farm',398,124,'farm'],['fw','Field of Plenty',143,500,'farm'],['fe','Meadow Farm',861,510,'farm'],['fs','South Farm',834,653,'farm'],
 ['ww','Western Forest',155,322,'forest'],['wn','Pine Forest',776,123,'forest'],['we','Eastern Forest',1078,510,'forest'],['ws','Southern Woods',415,721,'forest'],
 ['qn','Stone Quarry',578,107,'quarry'],['qw','Western Quarry',362,468,'quarry'],['qe','River Quarry',1082,349,'quarry'],
 ['in','Iron Mine',816,321,'mine'],['is','Deep Iron Mine',655,674,'mine'],
 ['vh','Hill Village',377,310,'village'],['ve','East Village',984,301,'village'],['vs','South Village',389,618,'village'],['vn','North Hamlet',677,242,'village'],
 ['jn','Northern Crossroads',572,254,'cross'],['jw','Western Crossroads',481,421,'cross'],['js','Southern Crossroads',589,552,'cross'],['city','Royal City',612,390,'city']
].map(([id,name,x,y,type])=>({id,name,x,y,type}));
const NODE=Object.fromEntries(NODES.map(n=>[n.id,n]));
const EDGES=[
 ['red','hr'],['blue','hb'],['gold','hg'],['green','hv'],
 ['hr','fn'],['hr','ww'],['hr','vh'],['fn','qn'],['fn','vh'],['qn','jn'],['qn','wn'],['wn','hb'],['wn','vn'],['hb','vn'],['hb','ve'],
 ['ww','vh'],['ww','fw'],['vh','jn'],['vh','jw'],['vh','qw'],['vn','jn'],['vn','in'],['jn','city'],['jn','in'],
 ['fw','qw'],['fw','hg'],['qw','jw'],['qw','vs'],['jw','city'],['jw','js'],['hg','vs'],['hg','ws'],['vs','ws'],['vs','js'],
 ['ve','in'],['ve','qe'],['ve','we'],['qe','in'],['qe','city'],['qe','we'],['we','hv'],['we','fe'],['fe','hv'],['fe','fs'],['fe','city'],
 ['city','in'],['city','js'],['js','is'],['js','fs'],['js','vs'],['is','fs'],['is','ws'],['fs','hv']
].map(([a,b])=>({a,b,id:[a,b].sort().join('|')}));
const EDGE=Object.fromEntries(EDGES.map(e=>[e.id,e]));
const incident=id=>EDGES.filter(e=>e.a===id||e.b===id),other=(e,id)=>e.a===id?e.b:e.a;
const ec=(a,b)=>[a,b].sort().join('|'),fmt=n=>n[0].toUpperCase()+n.slice(1),byId=id=>NODE[id];
const clone=o=>JSON.parse(JSON.stringify(o)),escapeHTML=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S=null,screen='menu',selection=null,moveSource=null,moveUnits={levy:0,archer:0,knight:0},modal='',busy=false,aiTimer=null,soundOn=true,setup={count:2,controllers:['human','ai','human','ai'],factions:[0,1,2,3]};
const app=document.getElementById('app'),modalRoot=document.getElementById('modal-root'),toastEl=document.getElementById('toast');
function tell(s){toastEl.textContent=s;toastEl.classList.remove('hidden');clearTimeout(tell.timer);tell.timer=setTimeout(()=>toastEl.classList.add('hidden'),2700)}
function snd(f=420){if(!soundOn)return;try{const C=window.AudioContext||window.webkitAudioContext;snd.ctx=snd.ctx||new C();const o=snd.ctx.createOscillator(),g=snd.ctx.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.035,snd.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,snd.ctx.currentTime+.14);o.connect(g).connect(snd.ctx.destination);o.start();o.stop(snd.ctx.currentTime+.15)}catch(e){}}
function log(s){S.log.unshift('Round '+S.round+': '+s);S.log=S.log.slice(0,65)}
function persist(){try{if(S)localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){tell('Browser storage unavailable. Save could not be written.')}}
function exists(){try{return !!(localStorage.getItem(SAVE)||localStorage.getItem(OLD_SAVE))}catch(e){return false}}
const active=()=>S.players[S.active],state=id=>S.places[id],troops=u=>UI.reduce((n,k)=>n+(u?.[k]||0),0),armies=p=>NODES.reduce((n,v)=>n+(state(v.id).owner===p?troops(state(v.id).units):0),0),power=(u,prop)=>UI.reduce((n,k)=>n+(u[k]||0)*UNITS[k][prop],0),freeUnits=()=>({levy:0,archer:0,knight:0}),costOK=(p,c)=>Object.entries(c).every(([k,v])=>(p[k]||0)>=v),charge=(p,c)=>{for(const k in c)p[k]-=c[k]};
function validSave(s){
 try{
  if(!s||s.version!==VER||!Array.isArray(s.players)||s.players.length<2||s.players.length>4||!s.places||!s.roads||!Number.isInteger(s.active)||s.active<0||s.active>=s.players.length||s.round<1||s.round>10||!Array.isArray(s.log)||!Array.isArray(s.winners)||!Number.isInteger(s.buildLeft)||s.buildLeft<0||s.buildLeft>2||!Number.isInteger(s.attackLeft)||s.attackLeft<0||s.attackLeft>2)return false;
  for(const n of NODES){const x=s.places[n.id];if(!x||![null,...s.players.map(p=>p.id)].includes(x.owner)||!Number.isInteger(x.stock)||x.stock<0||x.stock>12||![null,'tower','barracks'].includes(x.building)||!x.units||UI.some(k=>!Number.isInteger(x.units[k])||x.units[k]<0||x.units[k]>4)||troops(x.units)>4)return false;}
  for(const e of EDGES){if(![undefined,...s.players.map(p=>p.id)].includes(s.roads[e.id]))return false;}
  for(let i=0;i<s.players.length;i++){
   let p=s.players[i];if(p.id!==i||p.faction<0||p.faction>3||!['human','ai'].includes(p.controller)||!['red','blue','gold','green'].includes(p.home)||RK.some(k=>!Number.isInteger(p[k])||p[k]<0||p[k]>100)||!Number.isInteger(p.score)||p.score<0||!Array.isArray(p.caravans)||p.caravans.length>3||armiesSave(s,i)>14)return false;
   if(s.places[p.home].owner!==i)return false;
   for(const c of p.caravans){if(!NODE[c.at]||(c.target&&!NODE[c.target])||!['out','back'].includes(c.dir)||!['timber','stone','food','iron',null].includes(c.cargoType)||!Number.isInteger(c.cargo)||c.cargo<0||c.cargo>4)return false;}
  }
  return true;
 }catch(e){return false;}
}
function armiesSave(s,i){return NODES.reduce((a,n)=>a+(s.places[n.id].owner===i?troops(s.places[n.id].units):0),0)}
function newGame(){
 const used=setup.count===2?['red','green']:setup.count===3?['red','blue','gold']:['red','blue','gold','green'];
 S={version:VER,round:1,active:0,collected:false,marketBought:0,buildLeft:2,attackLeft:2,players:[],places:{},roads:{},log:[],finished:false,winners:[],pending:null};
 for(const n of NODES)S.places[n.id]={owner:null,stock:0,building:null,units:freeUnits(),town:false};
 for(let i=0;i<setup.count;i++){
  const home=used[i],v={red:'hr',blue:'hb',gold:'hg',green:'hv'}[home];
  const p={id:i,home,controller:setup.controllers[i],faction:setup.factions[i],gold:6,timber:2,stone:2,food:2,iron:0,score:0,caravans:[{id:1,at:home,target:null,dir:'out',cargo:0,cargoType:null}]};
  S.players.push(p);state(home).owner=i;state(v).owner=i;state(home).units={levy:2,archer:1,knight:0};S.roads[ec(home,v)]=i;
 }
 log('The kingdoms awaken. Claim resources, build roads, and command your armies.');
 selection=null;moveSource=null;screen='game';startTurnIncome();persist();render();runIfAI();
}
function resume(){
 try{
  const raw=localStorage.getItem(SAVE)||localStorage.getItem(OLD_SAVE);
  if(!raw)throw Error('No save');
  const data=JSON.parse(raw);
  if(data.version===2){data.version=3;delete data.phase;data.pending=null;}
  if(!validSave(data))throw Error('Invalid saved match');
  S=data;selection=null;moveSource=null;screen='game';
  if(S.pending){S.pending=null;}
  if(!S.collected&&!S.finished)startTurnIncome();
  persist();render();runIfAI();
 }catch(e){tell('Saved match is invalid or incompatible. Start a new game.');}
}
function connected(p){const found=new Set([p.home]),queue=[p.home];while(queue.length){const u=queue.shift();for(const e of incident(u)){const v=other(e,u);if(S.roads[e.id]!==p.id||found.has(v)||state(v).owner!==p.id)continue;found.add(v);queue.push(v)}}return found}
function route(p,start,dest){if(!NODE[start]||!NODE[dest])return null;const done=new Set([start]),q=[[start]];while(q.length){const path=q.shift(),u=path.at(-1);if(u===dest)return path;for(const e of incident(u)){const v=other(e,u);if(S.roads[e.id]!==p.id||state(v).owner!==p.id||done.has(v))continue;done.add(v);q.push([...path,v])}}return null}
function roadOptions(p){
 const network=connected(p),list=[];
 for(const e of EDGES){
  if(S.roads[e.id]!==undefined)continue;
  const a=state(e.a),b=state(e.b);
  if((network.has(e.a)&&b.owner!==null&&b.owner!==p.id)||(network.has(e.b)&&a.owner!==null&&a.owner!==p.id))continue;
  if(network.has(e.a)||network.has(e.b))list.push(e);
 }
 return list;
}
function canBuildRoad(p,e){return !!e&&S.buildLeft>0&&!S.finished&&S.roads[e.id]===undefined&&roadOptions(p).some(x=>x.id===e.id)&&costOK(p,BUILD_COST.road)}
function buildRoad(eid){
 const p=active(),e=EDGE[eid];
 if(!canBuildRoad(p,e)){tell('This road cannot be built yet. You need a connected route, 1 Timber, 1 Stone and a building action.');return false;}
 charge(p,BUILD_COST.road);S.roads[e.id]=p.id;
 for(const id of [e.a,e.b])if(state(id).owner===null&&byId(id).type!=='city')state(id).owner=p.id;
 S.buildLeft--;
 log(FACTIONS[p.faction].name+' builds a road between '+byId(e.a).name+' and '+byId(e.b).name+'.');
 selection='edge:'+eid;moveSource=null;snd(540);persist();render();return true;
}
function purchase(kind){const p=active();if(S.finished||!S.collected||p.controller!=='human'||!PRICES[kind])return;if(S.marketBought>=4)return tell('The visiting merchants are sold out this turn.');if(p.gold<PRICES[kind])return tell('Not enough Gold.');p.gold-=PRICES[kind];p[kind]++;S.marketBought++;log(FACTIONS[p.faction].name+' buys '+fmt(kind)+' at market.');snd(560);persist();render()}
function claimIncome(p){const homeVillage={red:'hr',blue:'hb',gold:'hg',green:'hv'}[p.home];return 4+(state(homeVillage).town?2:0)+NODES.filter(n=>n.type==='village'&&state(n.id).owner===p.id).length}
function tickCaravan(p,c){
 if(!NODE[c.at])c.at=p.home;
 if(!c.target){if(c.cargo&&c.cargoType&&route(p,c.at,p.home)){c.dir='back';}else return;}
 let steps=2;
 while(steps-->0){
  const hasTarget=c.target&&NODE[c.target]&&state(c.target).owner===p.id&&route(p,p.home,c.target);
  if(!hasTarget){
   if(c.cargo>0&&route(p,c.at,p.home))c.dir='back';

  if(!t.building&&n.type!=='city'&&n.id!==p.home)html+=`<div class="btnrow" style="margin-top:8px"><button class="btn" data-action="structure" data-kind="tower" data-id="${n.id}">Tower · 2 Timber, 2 Stone</button><button class="btn" data-action="structure" data-kind="barracks" data-id="${n.id}">Barracks · 2 Timber, 2 Stone, 1 Food</button></div>`;
  if(n.id===({red:'hr',blue:'hb',gold:'hg',green:'hv'}[p.home])&&!t.town)html+=`<button class="btn wide" data-action="structure" data-kind="town" data-id="${n.id}">Upgrade Village (+2 Gold taxes)</button>`;
  if(n.id===p.home||t.building==='barracks')html+=`<h3>Recruit Soldiers</h3><div class="btnrow">${UI.map(k=>`<button class="btn" data-action="recruit" data-kind="${k}" data-id="${n.id}" ${!costOK(p,UNITS[k].cost)||troops(t.units)>=4||armies(p.id)>=14?'disabled':''}>${UNITS[k].icon} ${fmt(k)}</button>`).join('')}</div>`;
 }
 if(mine&&human&&S.attackLeft>0){
  if(troops(t.units))html+=`<button class="btn wide ${moveSource===n.id?'active':''}" data-action="chooseArmy" data-id="${n.id}">⚔️ ${moveSource===n.id?'Adjust marching troops':'Command this army'}</button>`;
  if(moveSource===n.id){
   html+=`<h3>Marching Army</h3>${UI.filter(k=>t.units[k]).map(k=>`<div class="choice"><span>${UNITS[k].icon} ${fmt(k)}</span><span><button class="btn" data-action="adjust" data-kind="${k}" data-d="-1">−</button> ${moveUnits[k]} <button class="btn" data-action="adjust" data-kind="${k}" data-d="1">+</button></span></div>`).join('')}<div class="hint">Select your troops, then click any adjacent location to move or attack. Soldiers can use dirt trails before a road is built.</div>`;
  }
 }
 return html;
}
function rightPanel(){const p=active();return `<aside class="right"><section class="panel">${nodePanel()}</section><section class="panel"><h2>Kingdom Standings</h2>${roster()}<p class="small" style="margin-top:8px">Win with 15 Influence after a completed round or highest after 10 rounds.</p></section><section class="panel"><h2>Royal Chronicle</h2><div class="log">${S.log.slice(0,11).map(s=>`<div>${escapeHTML(s)}</div>`).join('')}</div></section></aside>`}
function boardPage(){
 app.innerHTML=`<header class="top"><div><div class="logo">⚜ Shifting Kingdoms</div><div class="tag">THE FOUR KINGDOMS · THE LIVING WORLD</div></div><div class="banner"><b>Round ${S.round} / 10</b><span>${FACTIONS[active().faction].name}'s Turn</span><button class="btn" data-action="rules">Rules</button><button class="btn" data-action="sound">♫ ${soundOn?'On':'Off'}</button><button class="btn" data-action="menu">Menu</button></div></header><main class="main">${leftPanel()}<section class="mapcol"><div class="map-shell"><div class="map-scroll">${mapSVG()}</div><div class="map-legend">● Solid = built road<br>┄ Dots = future road<br>✦ Gold = build now</div></div><div class="mapfoot">Click a highlighted dirt road to build it · Click a location to inspect or command troops</div></section>${rightPanel()}</main>`;
 if(S.finished)showVictory();
}
function render(){if(screen==='menu')menu();else if(screen==='setup')setupPage();else if(screen==='game'&&S)boardPage()}
function openModal(html,type='custom'){modal=type;modalRoot.className='modalback';modalRoot.innerHTML=`<section class="modal" role="dialog" aria-modal="true">${html}</section>`}
function closeModal(){modal='';modalRoot.className='hidden';modalRoot.innerHTML=''}
function rules(){openModal(`<h2>📜 How to Play</h2>
 <p><b>Your turn is continuous:</b> taxes and caravan deliveries happen automatically at the beginning. Buy goods, build, and move armies in whatever order you choose. Click <b>End Turn</b> when ready.</p>
 <p><b>Roads:</b> Dotted trails are unbuilt. Gold-glowing routes can be built by clicking directly (1 Timber + 1 Stone). You have 2 building actions per turn, and can build connected roads, recruit soldiers, or construct buildings.</p>
 <p><b>Caravans:</b> Connect a resource location to your Castle using your roads, control the site, then assign a caravan. Caravans travel 2 road links per turn, deliver up to 4 resources, and repeat automatically.</p>
 <p><b>Merchants:</b> Use tax Gold to buy up to 4 resource units each turn. Timber, Stone and Food cost 2 Gold, Iron costs 4.</p>
 <p><b>Armies:</b> You have 2 army orders per turn. Select your own troops and an adjacent location. Battles have no dice; attackers win only when stronger than defenders. Enemy starting Castles cannot be conquered.</p>
 <p><b>Victory:</b> Gain 1 Crown Influence per neutral village, 3 for the Royal City, and 1 per 3 owned resource sites each completed round. Win with 15 Influence or the highest after 10 rounds.</p>
 <div class="btnrow"><button class="btn primary" data-action="close">Return to Game</button></div>`,'rules')}
function market(){const p=active();openModal(`<h2>🏪 Visiting Merchant</h2><p>Buy emergency materials with your tax income. The merchant can sell four units per turn.</p><p><b>${p.gold} Gold</b> · ${4-S.marketBought} purchases remaining</p>${Object.keys(PRICES).map(k=>`<div class="choice"><label>${fmt(k)} — ${PRICES[k]} Gold each</label><button class="btn" data-action="buy" data-kind="${k}" ${p.gold<PRICES[k]||S.marketBought>=4?'disabled':''}>Buy 1</button></div>`).join('')}<div class="btnrow"><button class="btn primary" data-action="close">Done Trading</button></div>`,'market')}
function caravanModal(){const p=active(),sites=NODES.filter(n=>INFO[n.type]?.resource&&state(n.id).owner===p.id&&route(p,p.home,n.id));openModal(`<h2>🚚 Royal Caravans</h2><p>Caravans automatically move two road connections per Collect. They bring back up to four units of a single resource at a time.</p>${p.caravans.map((c,i)=>`<div class="location"><b>Caravan ${i+1}</b><p class="small">At ${NODE[c.at].name}. ${c.cargo?`Carrying ${c.cargo} ${c.cargoType}.`:c.target?'Traveling toward '+NODE[c.target].name+'.':'Idle.'}</p><label for="wagon-${i}">Route destination</label><select id="wagon-${i}" class="wagon" data-wagon="${i}" style="width:100%;padding:8px"><option value="">Stop / remain idle</option>${sites.map(n=>`<option value="${n.id}" ${c.target===n.id?'selected':''}>${n.name} (${fmt(INFO[n.type].resource)})</option>`).join('')}</select></div>`).join('')}<div class="btnrow"><button class="btn primary" data-action="close">Done</button></div>`,'caravans')}
function showVictory(){if(modal==='victory')return;let names=S.winners.map(i=>FACTIONS[S.players[i].faction].name).join(' & ');openModal(`<div class="center"><div style="font-size:5rem;color:#966d35">♛</div><h2>${S.winners.length>1?'A Shared Crown':'A New Sovereign'}</h2><h2>${escapeHTML(names)}</h2><p>The kingdoms fought for ${S.round} rounds.</p>${S.players.map(p=>`<div class="line"><span>${factionLabel(p)}</span><b>${p.score} Influence</b></div>`).join('')}<div class="btnrow" style="justify-content:center;margin-top:18px"><button class="btn primary" data-action="setup">New Match</button><button class="btn" data-action="leave">Main Menu</button></div></div>`,'victory')}
/* =============================================================
   Computer opponents. They use the same legal moves as people.
   ============================================================= */
function distToGoal(start,p){const goals=NODES.filter(n=>n.type==='city'||INFO[n.type]?.resource&&state(n.id).owner!==p.id||n.type==='village'&&state(n.id).owner!==p.id).map(n=>n.id);if(!goals.length)return 0;const seen=new Set([start]),q=[[start,0]];while(q.length){const [id,d]=q.shift();if(goals.includes(id))return d;for(const e of incident(id)){const v=other(e,id);if(!seen.has(v)){seen.add(v);q.push([v,d+1])}}}return 9}
function bestAIroad(p){const opts=roadOptions(p),res=opts.map(e=>{const net=connected(p),id=net.has(e.a)?e.b:e.a,n=NODE[id],owner=state(id).owner;let value=0;if(INFO[n.type]?.resource){value+=36+(n.type==='forest'?8:0)+(n.type==='quarry'?7:0)}else if(n.type==='village')value+=18;else if(n.type==='city')value-=12;else value+=17;value+=Math.max(0,6-distToGoal(id,p))*3;if(owner===p.id)value-=8;if(S.roads[e.id]!==undefined)value-=6;return{e,value}});res.sort((a,b)=>b.value-a.value);return res[0]?.e}
function bestAImarch(p){let choices=[];for(const n of NODES){const t=state(n.id);if(t.owner!==p.id||!troops(t.units))continue;const sets=[clone(t.units)];for(const k of UI)if(t.units[k]){let u=freeUnits();u[k]=t.units[k];sets.push(u)}for(const u of sets){for(const e of incident(n.id)){const target=other(e,n.id),dst=state(target);if(!canAttack(n.id,target,u))continue;const b=combat(n.id,target,u);if(b.enemy&&!b.win)continue;let value=0;if(dst.owner!==p.id){value+=8;if(INFO[NODE[target].type]?.resource)value+=18;if(NODE[target].type==='city')value+=30;if(NODE[target].type==='village')value+=22;if(dst.owner!==null)value+=5;value+=Math.max(0,5-distToGoal(target,p))*2;}else value+=(distToGoal(n.id,p)-distToGoal(target,p))*4-6;if(n.id===p.home)value+=5;if(state(n.id).building==='tower')value-=6;if(dst.owner===p.id&&troops(dst.units)>=2)value-=12;value-=troops(u)*.2;choices.push({from:n.id,to:target,u,b,value})}}}choices.sort((a,b)=>b.value-a.value);return choices[0]}
function runIfAI(){clearTimeout(aiTimer);if(!S||screen!=='game'||S.finished||modal||active().controller!=='ai')return;aiTimer=setTimeout(aiStep,270)}
function aiStep(){
 if(!S||screen!=='game'||S.finished||modal||active().controller!=='ai'||busy)return;
 const p=active();
 // Buy missing materials once per AI step, within the same merchant limit as humans.
 while(S.marketBought<4&&p.gold>=2&&(p.timber<2||p.stone<2||p.food<1)){
  const k=p.timber<p.stone?'timber':p.stone<2?'stone':'food';
  p.gold-=PRICES[k];p[k]++;S.marketBought++;
 }
 for(const c of p.caravans){
  if(!c.target){const n=NODES.find(n=>INFO[n.type]?.resource&&state(n.id).owner===p.id&&route(p,p.home,n.id));if(n)c.target=n.id;}
 }
 if(S.buildLeft>0){
  let done=false;const road=bestAIroad(p);
  if(road&&canBuildRoad(p,road))done=buildRoad(road.id);
  if(!done&&armies(p.id)<10){
   const home=state(p.home);
   let kind=p.food>=2&&p.iron>=1&&p.gold>=2?'knight':p.food>=1&&p.gold>=1?'levy':null;
   if(kind&&troops(home.units)<4&&costOK(p,UNITS[kind].cost))done=recruit(kind,p.home);
  }
  if(!done&&costOK(p,BUILD_COST.town)){
   const v={red:'hr',blue:'hb',gold:'hg',green:'hv'}[p.home];
   if(!state(v).town)done=buildStructure('town',v);
  }
  if(!done)S.buildLeft=0;
  persist();render();
  aiTimer=setTimeout(aiStep,110);return;
 }
 if(S.attackLeft>0){
  const choice=bestAImarch(p);
  if(choice&&choice.value>0)moveAttack(choice.from,choice.to,choice.u,true);
  else S.attackLeft=0;
  persist();render();
  aiTimer=setTimeout(aiStep,110);return;
 }
 advance();
}
/* =============================================================
   Event control — all game commands are validated in the engine.
   ============================================================= */
function selectNode(id){
 if(!S||S.finished||modal||busy||active().controller==='ai')return;
 if(moveSource&&id!==moveSource&&troops(moveUnits)>0&&canAttack(moveSource,id,moveUnits)){moveAttack(moveSource,id,clone(moveUnits));return;}
 selection=id;moveSource=null;moveUnits=freeUnits();render();
}
function selectEdge(id){
 if(!S||S.finished||modal||busy||active().controller==='ai')return;
 if(canBuildRoad(active(),EDGE[id])){buildRoad(id);return;}
 selection='edge:'+id;moveSource=null;render();
}
function changeMove(kind,d){if(!moveSource||!UNITS[kind])return;const available=state(moveSource).units[kind];moveUnits[kind]=Math.max(0,Math.min(available,moveUnits[kind]+d));render();}
function handle(action,data={}){if(busy)return;if(modal&&!['close','buy','confirmBattle','cancelBattle','setup','leave'].includes(action))return;
 if(action==='rules'){rules();return;}if(action==='close'){closeModal();if(S?.finished)showVictory();else render();return;}if(action==='menu'){if(screen==='game'&&!S?.finished){openModal(`<h2>Leave this Match?</h2><p>Your game is saved automatically. You can continue from the main menu.</p><div class="btnrow"><button class="btn primary" data-action="leave">Save and Exit</button><button class="btn" data-action="close">Stay</button></div>`,'leave');}else{screen='menu';closeModal();render();}return;}if(action==='leave'){clearTimeout(aiTimer);closeModal();screen='menu';render();return;}if(action==='setup'){clearTimeout(aiTimer);closeModal();screen='setup';render();return;}if(action==='resume'){closeModal();resume();return;}if(action==='start'){if(new Set(setup.factions.slice(0,setup.count)).size!==setup.count)return tell('Choose a different faction for each player.');closeModal();newGame();return;}if(action==='sound'){soundOn=!soundOn;render();return;}
 if(!S||screen!=='game'||S.finished)return;
 if(action==='confirmBattle'){const q=S.pending;if(!q)return;const from=q.from,to=q.to,u=q.units;S.pending=null;closeModal();moveAttack(from,to,u,true);return;}if(action==='cancelBattle'){S.pending=null;closeModal();persist();render();return;}if(action==='buy'){purchase(data.kind);market();return;}
 if(active().controller==='ai'||S.pending)return;
 if(action==='market'){market();return;}if(action==='caravans'){caravanModal();return;}if(action==='next'){advance();return;}
 if(action==='road'){buildRoad(data.id);return;}if(action==='newCaravan'){if(!buildStructure('caravan',active().home))tell('A caravan costs 2 Timber, 1 Stone, and 2 Gold.');return;}if(action==='structure'){if(!buildStructure(data.kind,data.id))tell('Construction unavailable: check materials, territory, and remaining build actions.');return;}if(action==='recruit'){if(!recruit(data.kind,data.id))tell('Recruitment unavailable: check food, Gold, Iron, and garrison capacity.');return;}if(action==='chooseArmy'){moveSource=data.id;moveUnits=clone(state(data.id).units);selection=data.id;render();return;}if(action==='adjust'){changeMove(data.kind,+data.d);return;}if(action==='dispatchSelect'){let p=active(),index=p.caravans.findIndex(c=>!c.target);dispatch(data.id,index>=0?index:0);return;}}
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&!b.disabled){handle(b.dataset.action,b.dataset);return;}const n=e.target.closest('[data-node]');if(n){selectNode(n.dataset.node);return;}const r=e.target.closest('[data-edge]');if(r){selectEdge(r.dataset.edge);return;}});
app.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const n=e.target.closest('[data-node]');if(n){e.preventDefault();selectNode(n.dataset.node)}});
app.addEventListener('change',e=>{const t=e.target;if(t.id==='count'){setup.count=+t.value;const taken=new Set();for(let i=0;i<setup.count;i++){if(taken.has(setup.factions[i]))setup.factions[i]=[0,1,2,3].find(n=>!taken.has(n));taken.add(setup.factions[i]);}render();return;}if(t.dataset.seat!==undefined){const i=+t.dataset.seat;if(t.dataset.setting==='controller')setup.controllers[i]=t.value;else{const chosen=+t.value;if(setup.factions.some((n,j)=>i!==j&&j<setup.count&&n===chosen)){tell('Each faction can only be chosen once.');render();return;}setup.factions[i]=chosen;}render();return;}});
modalRoot.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&!b.disabled)handle(b.dataset.action,b.dataset)});
modalRoot.addEventListener('change',e=>{const w=e.target.closest('[data-wagon]');if(!w||!S)return;const index=+w.dataset.wagon,c=active().caravans[index];if(!c)return;if(!w.value){c.target=null;if(!c.cargo){c.dir='out'}persist();return;}dispatch(w.value,index);caravanModal()});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal==='rules')closeModal()});
render();
</script></body></html>
